<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2430" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Receive — Mindwhisper</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="app">
    <h1 class="brand">Receive</h1>
    <p class="tagline">Listen for a hidden message in the room.</p>

    <div class="panel">
      <p class="status" id="status">Ready to listen</p>

      <div id="received" class="message-received" hidden>
        <div class="label">Message received</div>
        <div class="text" id="messageText"></div>
        <p class="quality" id="quality"></p>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="start">Start listening</button>
        <button type="button" class="secondary" id="again" hidden>Listen again</button>
        <button type="button" class="secondary" id="stop" disabled>Stop</button>
      </div>

      <p class="hint">Keep this page in the foreground. Place phones roughly 0.5–3 m apart, speakers unobstructed.</p>

      <section class="test-settings" id="testSettings" aria-label="Test settings">
        <h2>Test settings</h2>
        <label class="field-label" for="sensitivity">Sensitivity</label>
        <select id="sensitivity"></select>
        <p class="preset-desc" id="sensitivityDesc"></p>
      </section>

      <div id="debug" class="debug" hidden>
        <h2>Debug / field test</h2>
        <div id="debugBody"></div>
      </div>

      <details class="test-diagnostics" id="testDiagnostics" open>
        <summary>Test diagnostics</summary>
        <div class="diag-body" id="diagBody">Start listening to collect stats.</div>
        <div class="test-result" id="testResult" hidden></div>
        <button type="button" class="secondary" id="resetCounters">Reset test counters</button>
      </details>
    </div>

    <nav class="nav-links">
      <a href="index.html">Menu</a>
      <a href="tx.html">Transmit</a>
      <a href="rx2.html">Call RX</a>
    </nav>
  </main>

  <script type="module">
    import {
      Receiver,
      isDebugMode,
      RX_SENSITIVITY,
      RX_SENSITIVITY_ORDER,
    } from './js/rx.js';

    const rx = new Receiver();
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const againBtn = document.getElementById('again');
    const received = document.getElementById('received');
    const messageText = document.getElementById('messageText');
    const quality = document.getElementById('quality');
    const debug = document.getElementById('debug');
    const debugBody = document.getElementById('debugBody');
    const debugOn = isDebugMode();

    if (debugOn) debug.hidden = false;

    const stateLabels = {
      idle: 'Ready to listen',
      listening: 'Listening…',
      possible: 'Possible signal…',
      decoding: 'Frame detected… Decoding…',
      received: 'Message received',
      maintained: 'Signal maintained',
    };

    function renderDebug() {
      if (!debugOn) return;
      const info = rx.getDebugInfo();
      debugBody.textContent = JSON.stringify(info, null, 2);
    }

    // Sensitivity — gates how strict the preamble-correlation threshold is
    // before a candidate frame is even attempted. Lower = catches weaker
    // signal sooner; higher = fewer false "detected then failed" frames
    // in loud/noisy environments (street, traffic, background music).
    const sensitivitySel = document.getElementById('sensitivity');
    const sensitivityDesc = document.getElementById('sensitivityDesc');
    for (const id of RX_SENSITIVITY_ORDER) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = RX_SENSITIVITY.labels[id];
      if (id === RX_SENSITIVITY.defaultPreset) opt.selected = true;
      sensitivitySel.appendChild(opt);
    }
    function refreshSensitivityUi() {
      sensitivityDesc.textContent = RX_SENSITIVITY.descriptions[sensitivitySel.value] || '';
    }
    rx.setSensitivity(sensitivitySel.value);
    sensitivitySel.addEventListener('change', () => {
      rx.setSensitivity(sensitivitySel.value);
      refreshSensitivityUi();
    });
    refreshSensitivityUi();

    const diagBody = document.getElementById('diagBody');
    const testResult = document.getElementById('testResult');
    const resetBtn = document.getElementById('resetCounters');

    function renderDiagnostics() {
      const d = rx.getTestDiagnostics();
      const first =
        d.timeToFirstValidMs != null
          ? (d.timeToFirstValidMs / 1000).toFixed(1) + ' s'
          : '—';
      diagBody.innerHTML = [
        `Receiver state: ${d.receiverState}`,
        `Sensitivity: ${RX_SENSITIVITY.labels[d.sensitivity] || d.sensitivity}`,
        `Time to first valid message: ${first}`,
        `Valid frames: ${d.validFrames}`,
        `Failed frames: ${d.failedFrames}`,
        `Last signal quality: ${d.lastSignalQuality}`,
        `Hamming corrections: ${d.hammingCorrections ?? '—'}`,
      ].join('<br/>');
      if (d.validFrames > 0 && d.timeToFirstValidMs != null) {
        testResult.hidden = false;
        testResult.innerHTML =
          '<strong>Test result</strong><br/>First decode: ' +
          first +
          '<br/>Valid frames: ' +
          d.validFrames +
          '<br/>Failed frames: ' +
          d.failedFrames +
          '<br/>Signal quality: ' +
          d.lastSignalQuality;
      }
    }

    resetBtn.addEventListener('click', () => {
      rx.resetTestCounters();
      testResult.hidden = true;
      renderDiagnostics();
      renderDebug();
    });

    rx.onState = (state) => {
      status.textContent = stateLabels[state] || state;
      status.classList.toggle(
        'active',
        state === 'listening' ||
          state === 'possible' ||
          state === 'decoding' ||
          state === 'maintained'
      );
      if ((state === 'received' || state === 'maintained') && rx.lastMessage) {
        received.hidden = false;
        messageText.textContent = rx.lastMessage;
        let q = 'Signal quality: ' + rx.getSignalQuality();
        if (rx.signalConfirmed || state === 'maintained') {
          q += ' · Signal confirmed';
        }
        if (debugOn && rx.validFrameCount > 0) {
          q += ` · Valid frames: ${rx.validFrameCount}`;
        }
        quality.textContent = q;
        againBtn.hidden = false;
        startBtn.hidden = true;
      }
      if (state === 'listening') {
        received.hidden = true;
        againBtn.hidden = true;
        startBtn.hidden = true;
      }
      if (state === 'idle') {
        startBtn.hidden = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        againBtn.hidden = true;
      }
      renderDebug();
      renderDiagnostics();
    };

    rx.onMessage = () => { renderDebug(); renderDiagnostics(); };

    startBtn.addEventListener('click', async () => {
      try {
        startBtn.disabled = true;
        status.textContent = 'Requesting microphone…';
        await rx.start();
        stopBtn.disabled = false;
      } catch (e) {
        status.textContent = e.message || String(e);
        startBtn.disabled = false;
      }
      renderDebug();
    });

    stopBtn.addEventListener('click', async () => {
      await rx.stop();
    });

    againBtn.addEventListener('click', () => {
      received.hidden = true;
      rx.listenAgain();
      status.textContent = 'Listening…';
      status.classList.add('active');
      againBtn.hidden = true;
      startBtn.hidden = true;
      renderDebug();
    });

    // Periodic debug refresh while listening
    setInterval(() => {
      if (rx.listening) {
        if (debugOn) renderDebug();
        renderDiagnostics();
      }
    }, 1000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
