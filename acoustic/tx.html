<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2430" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Transmit — Mindwhisper</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="app">
    <h1 class="brand">Transmit</h1>
    <p class="tagline">Hidden message inside calm ambient sound.</p>

    <div class="panel">
      <div>
        <label class="field-label" for="message">Hidden message</label>
        <input
          id="message"
          type="text"
          maxlength="20"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="ELEPHANT"
          enterkeyhint="done"
        />
        <div class="meta-row">
          <span id="count">0 / 20 characters</span>
          <span id="error" class="error" hidden></span>
        </div>
      </div>

      <div>
        <span class="field-label" id="soundLabel">Sound</span>
        <div class="profile-list" role="radiogroup" aria-labelledby="soundLabel" id="profiles"></div>
      </div>

      <p class="hint">For testing, set the transmitting iPhone volume around 50–70%. Turn Silent Mode off.</p>
      <p class="hint">Keep this page open while playing. A–Z, a–z, 0–9, space, hyphen.</p>

      <div class="actions">
        <button type="button" class="primary" id="play">Start</button>
        <button type="button" class="secondary" id="stop" disabled>Stop</button>
      </div>

      <p class="status" id="status">Ready</p>

      <div id="debug" class="debug" hidden>
        <h2>Debug</h2>
        <div id="debugBody"></div>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Menu</a>
      <a href="rx.html">Receive</a>
      <a href="tx2.html">Call TX</a>
      <a href="credits.html">Credits</a>
    </nav>
  </main>

  <script type="module">
    import {
      Transmitter,
      isDebugMode,
      MAX_MESSAGE_LEN,
      WATERMARK_DELTA_DB_OPTIONS,
      AMBIENT_PROFILES,
      DEBUG_AMBIENT_PROFILES,
      DEFAULT_AMBIENT_PROFILE,
      PROFILE_IDS,
      ALL_PROFILE_IDS,
      preloadMeditationAudio,
      getMeditationLoadMeta,
    } from './js/tx.js';

    const tx = new Transmitter();
    const input = document.getElementById('message');
    const count = document.getElementById('count');
    const error = document.getElementById('error');
    const playBtn = document.getElementById('play');
    const stopBtn = document.getElementById('stop');
    const status = document.getElementById('status');
    const profilesEl = document.getElementById('profiles');
    const debug = document.getElementById('debug');
    const debugBody = document.getElementById('debugBody');
    const debugOn = isDebugMode();

    // Begin MP3 fetch immediately — shell already rendered.
    preloadMeditationAudio().catch(() => {});

    tx.setProfile(DEFAULT_AMBIENT_PROFILE);

    const order = debugOn
      ? ['meditation', 'air', 'tide', 'elements']
      : ['meditation', 'air'];
    const catalog = { ...AMBIENT_PROFILES, ...(debugOn ? DEBUG_AMBIENT_PROFILES : {}) };
    for (const id of order) {
      const p = catalog[id];
      if (!p) continue;
      const label = document.createElement('label');
      label.className = 'profile-option';
      label.innerHTML = `
        <input type="radio" name="profile" value="${p.id}" ${
          p.id === DEFAULT_AMBIENT_PROFILE ? 'checked' : ''
        } />
        <span class="profile-card">
          <span class="profile-name">${p.label}</span>
          <span class="profile-sub">${p.subtitle}</span>
        </span>
      `;
      profilesEl.appendChild(label);
    }

    function selectedProfile() {
      const el = profilesEl.querySelector('input[name="profile"]:checked');
      return el ? el.value : DEFAULT_AMBIENT_PROFILE;
    }

    profilesEl.addEventListener('change', () => {
      if (tx.playing) return;
      tx.setProfile(selectedProfile());
      renderDebug();
    });

    function setInputsLocked(locked) {
      input.disabled = locked;
      for (const r of profilesEl.querySelectorAll('input[name="profile"]')) {
        r.disabled = locked;
      }
    }

    function refreshCount() {
      const v = input.value;
      count.textContent = `${v.length} / ${MAX_MESSAGE_LEN} characters`;
      const check = tx.validate(v);
      if (tx.playing) {
        playBtn.disabled = true;
        return;
      }
      if (v.length === 0) {
        error.hidden = true;
        playBtn.disabled = true;
        return;
      }
      if (!check.ok) {
        error.hidden = false;
        error.textContent = check.error;
        playBtn.disabled = true;
      } else {
        error.hidden = true;
        playBtn.disabled = false;
      }
    }

    input.addEventListener('input', refreshCount);
    refreshCount();

    function setStatus(text, active) {
      status.textContent = text;
      status.classList.toggle('active', !!active);
    }

    function renderDebug() {
      if (!debugOn) return;
      const info = tx.getDebugInfo();
      let html = '';
      if (info) {
        html += `Profile: ${catalog[info.profile]?.label || info.profile}\n`;
        html += `Playing: ${info.playing}\n`;
        html += `Watermark: ${info.watermarkEnabled ? 'ON' : 'OFF'}\n`;
        html += `Music only: ${info.musicOnly ? 'yes' : 'no'}\n`;
        html += `Music gain: ${info.musicGain}\n`;
        html += `Crossfade: ${info.crossfadeSeconds}s\n`;
        if (info.music) {
          html += `Music active sources: ${info.music.activeSources}\n`;
          html += `Music next start: ${
            info.music.nextStartTime != null
              ? info.music.nextStartTime.toFixed(3)
              : '—'
          }\n`;
          html += `Buffer duration: ${info.music.bufferDuration?.toFixed?.(2) ?? '—'}\n`;
          html += `Cycle duration: ${info.music.cycleDuration?.toFixed?.(2) ?? '—'}\n`;
        }
        const load = info.meditationLoad || getMeditationLoadMeta();
        if (load) {
          html += `Audio request: ${load.startedAt ? 'started' : '—'}\n`;
          html += `Bytes loaded: ${load.bytes || 0}\n`;
          if (load.startedAt && load.finishedAt) {
            html += `Download ms: ${(load.finishedAt - load.startedAt).toFixed(0)}\n`;
          }
          if (load.error) html += `Audio error: ${load.error}\n`;
        }
        if (info.meditationMeta) {
          html += `Decode ms: ${info.meditationMeta.decodeMs?.toFixed?.(0) ?? '—'}\n`;
          html += `Decoded SR: ${info.meditationMeta.sampleRate} ch=${info.meditationMeta.channels}\n`;
        }
        html += `Session: ${(info.sessionDurationMs / 1000).toFixed(1)} s\n`;
        html += `Frames scheduled: ${info.framesScheduled}\n`;
        html += `Frames transmitted: ${info.framesTransmitted}\n`;
        html += `Next frame at: ${
          info.nextFrameScheduledAt != null
            ? info.nextFrameScheduledAt.toFixed(3)
            : '—'
        }\n`;
        html += `AudioContext time: ${
          info.audioContextTime != null ? info.audioContextTime.toFixed(3) : '—'
        }\n`;
        html += `Ambient seed: ${info.ambientSeed}\n`;
        html += `sampleRate: ${info.sampleRate}\n`;
        html += `Δ (watermark depth): ${info.deltaDb} dB\n`;
        html += `Active WM sources: ${info.activeSources}\n`;
        if (info.crc) html += `CRC: ${info.crc}\n`;
        if (info.rawFrame) html += `raw bytes: [${info.rawFrame.join(', ')}]\n`;
      }
      debugBody.textContent = html || 'Start once to populate.';
    }

    if (debugOn) {
      debug.hidden = false;
      const controls = document.createElement('div');
      controls.style.marginBottom = '0.75rem';
      controls.innerHTML = `
        <label>Watermark Δ (dB)
          <select id="deltaSel">${WATERMARK_DELTA_DB_OPTIONS.map((d) =>
            `<option value="${d}" ${d === 3.5 ? 'selected' : ''}>${d}</option>`
          ).join('')}</select>
        </label>
        <label style="display:block;margin-top:0.4rem;">Music gain
          <input type="range" id="musicGain" min="0.4" max="1" step="0.01" value="0.85"/>
        </label>
        <label style="display:block;margin-top:0.4rem;">Crossfade (s)
          <input type="range" id="xfade" min="5" max="12" step="0.5" value="8"/>
        </label>
        <div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;">
          <button type="button" class="secondary" id="wmOn" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">Meditation — WM ON</button>
          <button type="button" class="secondary" id="wmOff" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">Meditation — WM OFF</button>
          <button type="button" class="secondary" id="musicOnly" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">Music only</button>
        </div>
        <div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;" id="profileQuick">
          ${ALL_PROFILE_IDS.map(
            (id) =>
              `<button type="button" class="secondary profile-quick" data-profile="${id}" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">${catalog[id]?.label || id}</button>`
          ).join('')}
        </div>
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem;">
          <button type="button" class="secondary" id="abA" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">Play A (neutral)</button>
          <button type="button" class="secondary" id="abB" style="min-height:2.4rem;padding:0.5rem 0.9rem;font-size:0.85rem;">Play B (encoded)</button>
        </div>
        <fieldset style="margin-top:0.75rem;border:1px solid rgba(255,255,255,0.15);padding:0.6rem;">
          <legend>Ambient mix (Tide/Elements debug)</legend>
          <label style="display:block;font-size:0.8rem;">Solo
            <select id="ambSolo">
              <option value="full">Full Mix</option>
              <option value="base">Solo Base</option>
              <option value="events">Solo Events</option>
              <option value="watermarkBed">Solo Watermark Bed</option>
              <option value="seaBed">Tide: Sea bed</option>
              <option value="waves">Tide: Waves</option>
              <option value="foam">Tide: Foam</option>
              <option value="rainBed">Elements: Rain bed</option>
              <option value="droplets">Elements: Droplets</option>
              <option value="wind">Elements: Wind</option>
              <option value="water">Elements: Water</option>
              <option value="support">Support bed</option>
            </select>
          </label>
          <div id="tideParams" style="margin-top:0.4rem;font-size:0.75rem;display:grid;gap:0.25rem;">
            <label>master <input type="range" id="p_TIDE_MASTER_GAIN" min="1" max="8" step="0.1" value="3.2"/></label>
            <label>wave <input type="range" id="p_TIDE_WAVE_GAIN" min="0" max="2" step="0.01" value="1"/></label>
            <label>sea bed <input type="range" id="p_TIDE_SEA_BED_GAIN" min="0" max="1.2" step="0.01" value="0.7"/></label>
            <label>foam <input type="range" id="p_TIDE_FOAM_GAIN" min="0" max="1.5" step="0.01" value="0.45"/></label>
            <label>spray <input type="range" id="p_TIDE_SPRAY_GAIN" min="0" max="0.4" step="0.01" value="0.08"/></label>
            <label>pad warmth <input type="range" id="p_TIDE_PAD_GAIN" min="0" max="0.3" step="0.01" value="0.14"/></label>
            <label>interval mean <input type="range" id="p_TIDE_INTERVAL_MEAN" min="5.8" max="10.5" step="0.1" value="8"/></label>
          </div>
          <div id="elementsParams" style="margin-top:0.4rem;font-size:0.75rem;display:grid;gap:0.25rem;">
            <label>master <input type="range" id="p_ELEMENTS_MASTER_GAIN" min="1" max="5" step="0.1" value="2"/></label>
            <label>rain <input type="range" id="p_ELEMENTS_RAIN_GAIN" min="0" max="1.5" step="0.01" value="0.45"/></label>
            <label>droplets <input type="range" id="p_ELEMENTS_DROPLET_GAIN" min="0" max="1" step="0.01" value="0.2"/></label>
            <label>wind <input type="range" id="p_ELEMENTS_WIND_GAIN" min="0" max="1" step="0.01" value="0.5"/></label>
            <label>distant water <input type="range" id="p_ELEMENTS_WATER_GAIN" min="0" max="0.5" step="0.01" value="0.16"/></label>
            <label>pad warmth <input type="range" id="p_ELEMENTS_PAD_GAIN" min="0" max="0.3" step="0.01" value="0.16"/></label>
            <label>brightness <input type="range" id="p_ELEMENTS_BRIGHTNESS" min="0.1" max="1" step="0.01" value="0.35"/></label>
          </div>
          <p class="hint" style="margin-top:0.4rem;">Stop → adjust → Start. Seed: ${0xa11ce55.toString(16)}</p>
        </fieldset>
        <p class="hint" style="margin-top:0.5rem;">Profile quick-select works while idle. Music-only disables watermark for loop-seam listening.</p>
      `;
      debug.insertBefore(controls, debugBody);

      function collectAmbientDebug() {
        const debugOpts = { solo: document.getElementById('ambSolo').value };
        for (const el of controls.querySelectorAll('input[type=range][id^=p_]')) {
          debugOpts[el.id.slice(2)] = parseFloat(el.value);
        }
        return debugOpts;
      }
      function applyAmbientDebug() {
        if (tx.playing) return;
        tx.setAmbientDebug(collectAmbientDebug());
      }
      controls.querySelectorAll('input,select').forEach((el) => {
        el.addEventListener('change', applyAmbientDebug);
        el.addEventListener('input', applyAmbientDebug);
      });
      applyAmbientDebug();

      document.getElementById('deltaSel').addEventListener('change', (e) => {
        tx.setDeltaDb(parseFloat(e.target.value));
        renderDebug();
      });
      document.getElementById('musicGain').addEventListener('input', (e) => {
        tx.setMusicGain(parseFloat(e.target.value));
        renderDebug();
      });
      document.getElementById('xfade').addEventListener('input', (e) => {
        tx.setCrossfadeSeconds(parseFloat(e.target.value));
        renderDebug();
      });
      document.getElementById('wmOn').addEventListener('click', () => {
        if (tx.playing) return;
        tx.setProfile('meditation');
        tx.setMusicOnly(false);
        tx.setWatermarkEnabled(true);
        const radio = profilesEl.querySelector('input[value="meditation"]');
        if (radio) radio.checked = true;
        renderDebug();
      });
      document.getElementById('wmOff').addEventListener('click', () => {
        if (tx.playing) return;
        tx.setProfile('meditation');
        tx.setMusicOnly(false);
        tx.setWatermarkEnabled(false);
        const radio = profilesEl.querySelector('input[value="meditation"]');
        if (radio) radio.checked = true;
        renderDebug();
      });
      document.getElementById('musicOnly').addEventListener('click', () => {
        if (tx.playing) return;
        tx.setProfile('meditation');
        tx.setMusicOnly(true);
        tx.setWatermarkEnabled(false);
        const radio = profilesEl.querySelector('input[value="meditation"]');
        if (radio) radio.checked = true;
        renderDebug();
      });
      document.getElementById('profileQuick').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-profile]');
        if (!btn || tx.playing) return;
        const id = btn.getAttribute('data-profile');
        const radio = profilesEl.querySelector(`input[value="${id}"]`);
        if (radio) radio.checked = true;
        tx.setProfile(id);
        tx.setMusicOnly(false);
        renderDebug();
      });
      document.getElementById('abA').addEventListener('click', async () => {
        const msg = input.value;
        if (!tx.validate(msg).ok) return;
        await tx.prepareAB(msg);
        await tx.switchAB('A');
        setStatus('Playing A — neutral watermark', true);
        stopBtn.disabled = false;
        playBtn.disabled = true;
        renderDebug();
      });
      document.getElementById('abB').addEventListener('click', async () => {
        const msg = input.value;
        if (!tx.validate(msg).ok) return;
        if (!tx.bufferB) await tx.prepareAB(msg);
        await tx.switchAB('B');
        setStatus('Playing B — encoded watermark', true);
        stopBtn.disabled = false;
        playBtn.disabled = true;
        renderDebug();
      });
    }

    let debugTimer = null;

    tx.onState = (state) => {
      if (state === 'preparing') {
        setStatus('Preparing sound…', true);
        playBtn.disabled = true;
        return;
      }
      if (state === 'playing') {
        setStatus('Playing…', true);
        playBtn.disabled = true;
        stopBtn.disabled = false;
        setInputsLocked(true);
        if (debugOn && !debugTimer) {
          debugTimer = setInterval(renderDebug, 500);
        }
      } else if (state === 'ended' || state === 'stopped') {
        setStatus(state === 'ended' ? 'Finished' : 'Ready');
        setInputsLocked(false);
        playBtn.disabled = !tx.validate(input.value).ok;
        stopBtn.disabled = true;
        if (debugTimer) {
          clearInterval(debugTimer);
          debugTimer = null;
        }
      }
      renderDebug();
    };

    playBtn.addEventListener('click', async () => {
      try {
        tx.setProfile(selectedProfile());
        if (selectedProfile() === 'meditation') {
          setStatus('Preparing sound…', true);
        } else {
          setStatus('Starting…', true);
        }
        // Unlock audio in this tap — before any long work (iOS Safari).
        await tx.unlockAudio();
        await tx.play(input.value);
        const info = tx.getDebugInfo();
        if (info.audioContextState && info.audioContextState !== 'running') {
          setStatus(
            'Playing… but audio is ' + info.audioContextState + ' — tap Start again',
            true
          );
        }
        renderDebug();
      } catch (e) {
        setStatus(e.message || String(e));
        setInputsLocked(false);
        playBtn.disabled = false;
      }
    });

    stopBtn.addEventListener('click', () => tx.stop());

    // Do NOT auto-stop on visibilitychange — iOS fires this for Control Center,
    // banners, etc. Keep looping; only warn, and resume AudioContext when visible.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && tx.playing) {
        setStatus('Playing… (keep page open)', true);
      } else if (!document.hidden && tx.playing) {
        tx.resumeIfNeeded();
        setStatus('Playing…', true);
      }
    });

    // Hard navigation away — stop cleanly
    window.addEventListener('pagehide', () => {
      if (tx.playing) tx.stop();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
