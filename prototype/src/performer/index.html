<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Recover</title>
    <link rel="stylesheet" href="./performer.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1 class="brand">Recover</h1>
      </header>

      <section class="camera-panel">
        <h2 class="section-title">Camera</h2>
        <fieldset class="mode-select">
          <legend class="label">Scan mode</legend>
          <label class="radio">
            <input type="radio" name="scan-mode" id="mode-audio" value="audio" checked />
            Audio — primary
          </label>
          <label class="radio">
            <input type="radio" name="scan-mode" id="mode-hidden" value="hidden" />
            Hidden envelope — visual backup
          </label>
          <label class="radio">
            <input type="radio" name="scan-mode" id="mode-visible" value="visible" />
            Diagnostics / visible codes
          </label>
        </fieldset>
        <div class="camera-controls" id="camera-controls">
          <button id="cam-start" type="button" class="primary">Start camera</button>
          <button id="cam-stop" type="button" disabled>Stop camera</button>
          <button id="cam-refresh" type="button">Refresh cameras</button>
          <label class="field inline">
            <span class="label">Device</span>
            <select id="cam-device"></select>
          </label>
        </div>
        <div class="audio-controls" id="audio-controls">
          <button id="mic-start" type="button" class="primary">Start listening</button>
          <button id="mic-stop" type="button" disabled>Stop</button>
          <button id="mic-refresh" type="button">Refresh mics</button>
          <label class="field inline">
            <span class="label">Microphone</span>
            <select id="mic-device"></select>
          </label>
        </div>
        <div class="cam-preview-wrap" id="cam-preview-wrap">
          <video id="cam-video" class="cam-video" playsinline muted></video>
          <canvas id="henv-overlay" class="henv-overlay" hidden></canvas>
        </div>
        <p id="audio-level" class="henv-status" hidden>Level: —</p>
        <p id="henv-status" class="henv-status" aria-live="polite">Audio: idle</p>
        <p id="scan-state" class="scan-state">State: IDLE</p>
        <p id="cam-error" class="error" hidden></p>
      </section>

      <section class="lock-panel">
        <h2 class="section-title">Locked acquisition</h2>
        <p class="recovered-word-wrap">
          Recovered word:
          <strong id="recovered-word">—</strong>
        </p>
        <dl id="lock-dl" class="dl">
          <dt>Format</dt>
          <dd id="lock-format">—</dd>
          <dt>Payload</dt>
          <dd id="lock-payload" class="mono">—</dd>
          <dt>Acquired at</dt>
          <dd id="lock-acquired">—</dd>
          <dt>Last seen</dt>
          <dd id="lock-seen">—</dd>
        </dl>
        <button id="clear-lock" type="button">Clear / new read</button>
      </section>

      <section id="result" class="result" hidden>
        <h2 class="section-title">Dictionary match</h2>
        <dl id="result-dl" class="dl"></dl>
      </section>

      <details class="diagnostics-block">
        <summary class="section-title">Diagnostics / visible codes</summary>
        <section class="compose">
          <h2 class="section-title">Manual paste</h2>
          <label class="field">
            <span class="label">Payload (64 characters)</span>
            <textarea
              id="payload-input"
              class="payload"
              rows="3"
              spellcheck="false"
              autocomplete="off"
            ></textarea>
          </label>
          <button id="recover-btn" type="button" class="primary">Recover</button>
          <p id="form-error" class="error" hidden></p>
        </section>

        <section id="diagnostics" class="diagnostics" hidden>
          <h2 class="section-title">Timing &amp; counts</h2>
          <dl id="diagnostics-dl" class="dl"></dl>
        </section>

        <section id="debug" class="debug">
          <details>
            <summary class="section-title">Scanner debug</summary>
            <dl id="debug-dl" class="dl"></dl>
          </details>
          <details>
            <summary class="section-title">Hidden envelope debug (?debug=1)</summary>
            <dl id="henv-debug-dl" class="dl"></dl>
          </details>
        </section>
      </details>
    </main>
    <script src="./performer.js"></script>
  </body>
</html>
