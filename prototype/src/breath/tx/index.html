<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindwhisper TX - Spectator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-stop {
            background: #ff6b6b;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .status {
            padding: 16px;
            border-radius: 10px;
            background: #f5f5f5;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .status-text {
            font-size: 0.95rem;
            color: #666;
        }

        .status.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .status.active .status-text {
            color: #667eea;
            font-weight: 600;
        }

        .breath-indicator {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #999;
            font-style: italic;
        }

        .info {
            margin-top: 24px;
            padding: 16px;
            background: #fff9e6;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }

        .info p {
            margin: 6px 0;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mindwhisper TX</h1>
        <p class="subtitle">Spectator: Generate meditation audio from a word</p>

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="rx.html" style="color: #43cea2; text-decoration: none; font-size: 0.9rem;">Switch to RX (Performer) →</a>
        </div>

        <div class="input-group">
            <label for="word-input">Enter a word:</label>
            <input 
                type="text" 
                id="word-input" 
                placeholder="peace, calm, ocean..." 
                autocomplete="off"
            >
        </div>

        <div class="button-group">
            <button class="btn-start" id="start-btn">Start Session</button>
            <button class="btn-stop" id="stop-btn" disabled>Stop</button>
        </div>

        <div class="status" id="status">
            <div class="status-text">Enter a word and press Start</div>
        </div>

        <div class="info">
            <p><strong>How it works:</strong></p>
            <p>• Soft bowl chime phrase encodes the word (~every 15s)</p>
            <p>• Warm ambient pad + breath cues — not modem beeps</p>
            <p>• Works offline after first load</p>
        </div>
    </div>

    <script src="/tx/protocol.js"></script>
    <script src="/tx/audio-engine.js"></script>
    <script src="/tx/tx-app.js"></script>
</body>
</html>
